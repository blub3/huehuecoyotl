[global]
  server min protocol = SMB2_10
  server role = standalone server
  map to guest = never
  disable netbios = yes
  log level = 1
[media]
  path = /media
  read only = yes
  valid users = coyotl
# Issue #151: a writable share next to the read-only one.
[write]
  path = /write
  read only = no
  valid users = coyotl
  create mask = 0666
  directory mask = 0777
# Issue #157: the same folder, read-only.
[write-ro]
  path = /write
  read only = yes
  valid users = coyotl
