[package]
name = "huehuecoyotl-vfs-sftp"
description = "SFTP source"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false


[dependencies]
huehuecoyotl-vfs = { path = "../vfs", default-features = false }
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "macros", "net", "time"] }
# ring backend and no RSA: avoids aws-lc (CMake/NASM on Windows) and the `rsa` timing advisory.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
