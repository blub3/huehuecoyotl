[package]
name = "huehuecoyotl-core"
description = "Headless core: the API that the bridge and the CLI harness share"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
huehuecoyotl-library.workspace = true
huehuecoyotl-vfs.workspace = true
huehuecoyotl-vfs-sftp.workspace = true
huehuecoyotl-probe.workspace = true
huehuecoyotl-scanner.workspace = true
huehuecoyotl-metadata.workspace = true
huehuecoyotl-stream.workspace = true
keyring = "4"
# Issue #52: the store's persistence (never the in-memory mock store); the version keyring 4 uses.
keyring-core = "1.0.1"
mdns-sd = { version = "0.21", default-features = false }
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
crossbeam-channel.workspace = true
huehuecoyotl-stream.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile.workspace = true
wiremock = "0.6"

[features]
# Tests against the real TMDB API (needs COYOTL_TMDB_KEY): cargo test --features live-tmdb
live-tmdb = []

[lints]
workspace = true
