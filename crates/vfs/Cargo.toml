[package]
name = "huehuecoyotl-vfs"
description = "Source trait and protocol backends"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# SFTP lives in crates/vfs-sftp (russh). It shares the workspace with smb through the patched
# smb in third_party/smb (see the root Cargo.toml).
default = ["smb", "nfs", "webdav", "ftp"]
smb = ["dep:smb"]
nfs = ["dep:nfs-rs"]
webdav = ["dep:reqwest", "dep:rustls", "dep:quick-xml", "dep:percent-encoding", "dep:httpdate"]
ftp = ["dep:suppaftp"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-util = "0.3"
# Protocol clients, all pure Rust and permissively licensed (SPEC 3, 6).
smb = { version = "=0.12.1", optional = true }
nfs-rs = { version = "=0.12.0", optional = true }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls-no-provider", "http2", "stream"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12", "logging"] }
quick-xml = { version = "0.42", optional = true }
percent-encoding = { version = "2", optional = true }
httpdate = { version = "1", optional = true }
suppaftp = { version = "12.2", optional = true, default-features = false, features = ["tokio"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }

[lints]
workspace = true
