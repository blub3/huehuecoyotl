# cargo-about: licence texts of every Rust crate linked into the app (SPEC 10, release step 6).
# tools/notices.sh combines its output with the native libraries' licences.
accepted = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "MPL-2.0",
  "CDLA-Permissive-2.0",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Issue #163: the smb-rs crates are MIT but carry no licence file; their notice is the one in the
# upstream repository at the commit each crate was published from.
[smb.clarify]
license = "MIT"
[[smb.clarify.git]]
path = "LICENSE.md"
checksum = "b1ae904b7ae199a3cce5c5b8ca5b3fa323b98c51ac4d30e40775af11e9967788"

