# SPEC 10, CI step 6: release packages, third-party notices and a software bill of materials.
# Runs on a version tag (v1.0.0) and creates a *draft* GitHub release; a maintainer reviews and
# publishes it (GOVERNANCE.md: built by CI; while CI is unavailable, Windows may use a build VM).
#
# Linux: the Flatpak bundle. Windows: a portable zip and an unsigned MSIX, built by the shared
# workflow windows.yml (as in CI, but a Release build). Not here yet: code signing (#24).
# Flathub builds and signs the Flatpak itself from its own manifest.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  libmpv-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: third_party/mpv/out
          key: libmpv-${{ hashFiles('third_party/mpv/Dockerfile') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: third_party/mpv/build.sh
      - run: third_party/mpv/check-licence.sh third_party/mpv/out
      - uses: actions/upload-artifact@v4
        with: { name: libmpv-linux, path: third_party/mpv/out }

  linux:
    needs: libmpv-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (the SDK and the FFmpeg/mpv builds need more than a runner has)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - uses: actions/download-artifact@v4
        with: { name: libmpv-linux, path: third_party/mpv/out }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-about,cargo-cyclonedx" }
      - name: Flatpak tools and the KDE 6.11 SDK
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Flatpak and corresponding source bundles
        run: packaging/flatpak/build.sh --bundle-sources
      - name: Stage release assets and checksums
        run: |
          mkdir -p dist
          cp build/io.github.blub3.Huehuecoyotl.flatpak dist/
          cp build/io.github.blub3.Huehuecoyotl.Sources.flatpak build/flatpak-BUILDINFO.txt dist/
          cp packaging/flatpak/generated/THIRD_PARTY_NOTICES.txt dist/
          tools/sbom.sh dist/huehuecoyotl-sbom-rust.cdx.json
      - uses: actions/upload-artifact@v4
        with: { name: release-linux, path: dist }

  windows:
    uses: ./.github/workflows/windows.yml
    with: { build-type: Release, lgpl-sources: true }

  draft:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: release-linux, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: release-windows, path: windows }
      - uses: actions/download-artifact@v4
        with: { name: libmpv-windows-sources, path: windows-sources }
      - name: Collect the Windows files and the checksums of everything
        run: |
          cp windows/*.zip windows/*.msix windows/THIRD_PARTY_NOTICES-windows.txt dist/
          cp windows-sources/huehuecoyotl-windows-lgpl-sources.tar.xz dist/
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Draft release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Huehuecoyotl ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md dist/*
