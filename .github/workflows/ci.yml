# SPEC 10, CI pipeline. Step 6 (release packages) is in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.12.0"

jobs:
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Every commit is signed off (DCO)
        run: |
          missing=0
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || { echo "missing sign-off: $c"; missing=1; }
          done
          exit $missing

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # SPEC 10 step 3: the protocol conformance suite against real servers in containers
  # (Samba, NFS-Ganesha, rclone for WebDAV and SFTP, vsftpd), plus the network library flow.
  protocols:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\ncrates/vfs-sftp -> target" }
      - name: Start the test servers
        run: tests/servers/up.sh
      - name: Conformance (SMB, NFS, WebDAV, FTP) and the network library flow
        env: { COYOTL_TEST_SERVERS: "1", COYOTL_DISABLE_KEYSTORE: "1" }
        run: |
          cargo test -p huehuecoyotl-vfs --test conformance
          cargo test -p huehuecoyotl-core --test network_flow
      - name: SFTP (separate crate until smb's crypto dependencies are released)
        env: { COYOTL_TEST_SERVERS: "1" }
        run: |
          cargo clippy --manifest-path crates/vfs-sftp/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path crates/vfs-sftp/Cargo.toml
      - name: Server logs
        if: failure()
        run: docker compose -f tests/servers/compose.yaml logs --tail 100

  licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: { command: check licenses bans sources advisories }

  libmpv-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cache the LGPL libmpv bundle
        id: cache
        uses: actions/cache@v4
        with:
          path: third_party/mpv/out
          key: libmpv-${{ hashFiles('third_party/mpv/Dockerfile') }}
      - name: Build LGPL libmpv + FFmpeg (asserts -Dgpl=false and the FFmpeg configuration)
        if: steps.cache.outputs.cache-hit != 'true'
        run: third_party/mpv/build.sh
      - name: Licence assertions
        run: third_party/mpv/check-licence.sh third_party/mpv/out
      - uses: actions/upload-artifact@v4
        with: { name: libmpv-linux, path: third_party/mpv/out }

  app-linux:
    needs: libmpv-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: libmpv-linux, path: third_party/mpv/out }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jurplel/install-qt-action@v4
        with: { version: "${{ env.QT_VERSION }}", cache: true }
      - name: System packages
        # Runtime libraries the libmpv bundle links against (present on every desktop, not on
        # a bare runner): VA-API, PulseAudio, PipeWire, ALSA, fonts, lcms, xkbcommon.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libxcb-cursor0 libgl-dev libegl-dev clang-format \
            libva2 libva-drm2 libva-wayland2 libpulse0 libpipewire-0.3-0t64 libasound2t64 \
            libfreetype6 libfribidi0 libharfbuzz0b libfontconfig1 liblcms2-2 libxkbcommon0 libdrm2
      - name: clang-format
        run: clang-format --dry-run --Werror app/src/*.cpp app/src/*.h app/src/coyotl/*.h tests/*.cpp
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - name: Build (includes the QML compiler)
        run: cmake --build build
      - name: qmllint
        run: cmake --build build --target all_qmllint
      - name: Qt Quick Test (navigation and focus)
        run: ctest --test-dir build --output-on-failure
        env: { QT_QPA_PLATFORM: offscreen }
      - name: Qt runtime licence check
        run: tools/check-qt-runtime.sh build/app/coyotl
      # SPEC 9 performance budgets: measured on every push, not asserted. The runner renders
      # with llvmpipe, so the numbers track regressions; the budgets themselves are checked on
      # real hardware (docs/milestones/M4.md).
      - name: Performance budgets (5,000 movies, measured)
        env: { COYOTL_DISABLE_KEYSTORE: "1" }
        run: |
          sudo apt-get install -y xvfb
          cargo run --release -p huehuecoyotl-library --example bench_seed -- "$RUNNER_TEMP/bench" 5000
          for b in startup scroll; do
            timeout 120 xvfb-run -a -s "-screen 0 1920x1080x24" \
              build/app/coyotl --data-dir "$RUNNER_TEMP/bench" --benchmark $b --benchmark-out bench-$b.json || true
          done
          { echo '### Performance budgets (llvmpipe, indicative)'; echo '```'; cat bench-*.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: benchmarks, path: "bench-*.json", if-no-files-found: warn }

  flatpak:
    needs: libmpv-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        # Only for the licence texts in the third-party notices; the Flatpak builds its own libmpv.
        with: { name: libmpv-linux, path: third_party/mpv/out }
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-about }
      - name: Flatpak tools and the KDE 6.11 SDK
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.kde.Platform//6.11 org.kde.Sdk//6.11 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Validate the desktop file and AppStream metadata
        run: |
          desktop-file-validate packaging/linux/io.github.blub3.Huehuecoyotl.desktop
          appstreamcli validate --no-net packaging/linux/io.github.blub3.Huehuecoyotl.metainfo.xml
      - name: Cache the Flatpak module builds (FFmpeg, mpv, ...)
        uses: actions/cache@v4
        with:
          path: packaging/flatpak/.flatpak-builder
          key: flatpak-${{ hashFiles('packaging/flatpak/io.github.blub3.Huehuecoyotl.yml') }}-${{ github.sha }}
          restore-keys: flatpak-${{ hashFiles('packaging/flatpak/io.github.blub3.Huehuecoyotl.yml') }}-
      - name: Build the Flatpak
        run: packaging/flatpak/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: flatpak, path: build/io.github.blub3.Huehuecoyotl.flatpak }

  # Windows app build waits for the Windows LGPL libmpv recipe (open M0 item, see
  # docs/spike/M0-report.md section 5). Until then only the Rust job runs on Windows.
