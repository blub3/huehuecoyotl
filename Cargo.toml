[workspace]
resolver = "3"
members = ["crates/core", "crates/core-api", "crates/library", "crates/vfs", "crates/vfs-sftp", "crates/probe", "crates/scanner", "crates/metadata", "crates/stream", "crates/cli"]

[workspace.package]
version = "2.9.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/blub3/huehuecoyotl"
rust-version = "1.89"

[workspace.dependencies]
huehuecoyotl-core = { path = "crates/core" }
huehuecoyotl-library = { path = "crates/library" }
huehuecoyotl-vfs = { path = "crates/vfs" }
huehuecoyotl-vfs-sftp = { path = "crates/vfs-sftp" }
huehuecoyotl-probe = { path = "crates/probe" }
huehuecoyotl-scanner = { path = "crates/scanner" }
huehuecoyotl-stream = { path = "crates/stream" }
huehuecoyotl-metadata = { path = "crates/metadata" }
async-trait = "0.1"
bytes = "1"
crossbeam-channel = "0.5"
cxx = "1.0.205"
rusqlite = { version = "0.41", features = ["bundled"] }
# Issue #7: audio tags (MIT OR Apache-2.0).
lofty = "0.25.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
debug = 1
panic = "unwind"   # the bridge catches panics (SPEC 8, rule 7)

# smb 0.12.1 pins sspi 0.21.3, which pins pre-release RustCrypto crates that clash with russh
# (SFTP). third_party/smb is the published crate with only sspi raised to 0.23.1, as in the
# unmerged upstream fix afiffon/smb-rs#189. tools/check-smb-patch.sh verifies that in CI.
# Remove this once smb releases with the newer sspi.
[patch.crates-io]
smb = { path = "third_party/smb" }
