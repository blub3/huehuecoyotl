[workspace]
resolver = "3"
exclude = ["crates/vfs-sftp"]
members = ["crates/core", "crates/core-api", "crates/library", "crates/vfs", "crates/scanner", "crates/metadata", "crates/stream", "crates/cli"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/blub3/huehuecoyotl"
rust-version = "1.86"

[workspace.dependencies]
huehuecoyotl-core = { path = "crates/core" }
huehuecoyotl-library = { path = "crates/library" }
huehuecoyotl-vfs = { path = "crates/vfs" }
huehuecoyotl-scanner = { path = "crates/scanner" }
huehuecoyotl-stream = { path = "crates/stream" }
huehuecoyotl-metadata = { path = "crates/metadata" }
async-trait = "0.1"
bytes = "1"
crossbeam-channel = "0.5"
cxx = "1.0.205"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
debug = 1
panic = "unwind"   # the bridge catches panics (SPEC 8, rule 7)
