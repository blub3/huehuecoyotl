# SPEC 3: the dependency tree stays permissive. `cargo deny check` fails on any GPL crate.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
  "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "Unicode-DFS-2016", "BSL-1.0", "CC0-1.0", "MPL-2.0",
  # Mozilla's CA certificates as data (webpki-root-certs, via rustls-platform-verifier).
  "CDLA-Permissive-2.0",
]
# r-efi is "MIT OR Apache-2.0 OR LGPL-2.1-or-later"; the MIT/Apache choice is taken.

[[licenses.clarify]]
crate = "huehuecoyotl-core-api"
expression = "Apache-2.0"
license-files = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
deny = [
  # GPL Samba bindings (SPEC 1, 3)
  { crate = "smbc" },
  { crate = "smbclient-sys" },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
